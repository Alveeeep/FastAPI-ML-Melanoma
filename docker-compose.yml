services:
  postgres:
    image: postgres:16-alpine
    container_name: melanoma-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT:-5489}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - melanoma-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  melanoma-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melanoma-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
    networks:
      - melanoma-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  melanoma-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melanoma-bot
    profiles:
      - bot
    restart: unless-stopped
    depends_on:
      melanoma-api:
        condition: service_healthy
    env_file:
      - .env
    command: ["uv", "run", "python", "-m", "bot.main"]
    networks:
      - melanoma-net

volumes:
  postgres-data:

networks:
  melanoma-net:
    driver: bridge
