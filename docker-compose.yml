services:
  postgres:
    image: postgres:16-alpine
    container_name: melanoma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: melanoma
      POSTGRES_USER: melanoma
      POSTGRES_PASSWORD: melanoma
    ports:
      - "5489:5489"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melanoma -d melanoma"]
      interval: 10s
      timeout: 5s
      retries: 5

  melanoma-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melanoma-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-melanoma-cds-service}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      MODEL_NAME: ${MODEL_NAME:-resnet50v2}
      MODEL_WEIGHTS_PATH: /app/models/resnet50v2_c5_baseline_best.pt
      IMAGE_SIZE: ${IMAGE_SIZE:-224}
      DEVICE: ${DEVICE:-cpu}
      TTA_RUNS: ${TTA_RUNS:-4}
      ENABLE_AUTH: ${ENABLE_AUTH:-false}
      API_TOKEN: ${API_TOKEN:-change-me}
      REVIEW_MARGIN: ${REVIEW_MARGIN:-0.05}
      SCREENING_THRESHOLD: ${SCREENING_THRESHOLD:-0.237}
      HIGH_SPECIFICITY_THRESHOLD: ${HIGH_SPECIFICITY_THRESHOLD:-0.2621931731700897}
      DATABASE_URL: postgresql+asyncpg://melanoma:melanoma@postgres:5432/melanoma
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro

  melanoma-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melanoma-bot
    restart: unless-stopped
    depends_on:
      - melanoma-api
    env_file:
      - .env
    environment:
      API_BASE_URL: http://melanoma-api:8000
      API_MODE: ${API_MODE:-checkpoint}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-60}
      ENABLE_API_AUTH: ${ENABLE_AUTH:-false}
      API_TOKEN: ${API_TOKEN:-change-me}
    command: ["uv", "run", "python", "-m", "bot.main"]

volumes:
  postgres-data:
